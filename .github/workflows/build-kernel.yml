name: Build Linux Kernel for Xiaomi Pad 2

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses-dev bison flex libssl-dev libelf-dev \
            bc git dpkg-dev debhelper rsync kmod cpio fakeroot

      - name: Configure kernel
        run: |
          make xiaomipad2_defconfig
          # 关闭调试信息,避免生成巨大的 -dbg 包、拖慢编译
          scripts/config --disable DEBUG_INFO
          scripts/config --disable DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
          scripts/config --disable DEBUG_INFO_DWARF4
          scripts/config --disable DEBUG_INFO_DWARF5
          scripts/config --enable DEBUG_INFO_NONE
          make olddefconfig

      - name: Build Debian packages
        run: |
          make -j$(nproc) bindeb-pkg

      - name: Collect artifacts
        run: |
          mkdir -p output
          # deb 包生成在仓库上一级目录,必须移进仓库内才能被上传
          mv ../*.deb output/ || true
          rm -f output/*-dbg_*.deb
          ls -lh output/

      - name: Upload kernel packages
        uses: actions/upload-artifact@v4
        with:
          name: xiaomipad2-kernel-debs
          path: output/*.deb
          if-no-files-found: error
